spring.application.name=mantenimiento
server.port=8088

# Aqui es la conexi\u00f3n a la BD de Mantenimiento
spring.datasource.url=jdbc:postgresql://localhost:5432/mantenimiento_soa
spring.datasource.username=mantenimiento_app
spring.datasource.password=${MANTENIMIENTO_DB_PASSWORD:1234]}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true